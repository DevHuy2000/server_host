<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Admin Panel · Senzu Panel</title>
  <style>
    :root{--bg:#05060a;--muted:#99a3ad;--accent:#00d4ff;--border:rgba(255,255,255,.10);--card:rgba(255,255,255,.06);--shadow:0 18px 60px rgba(0,0,0,.55);--danger:#ff6b6b;--ok:#7CFF7C;--warn:#ffd166}
    *{box-sizing:border-box}
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    body{
      margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;color:rgba(255,255,255,.92);
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(0,212,255,.25), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(123,97,255,.22), transparent 55%),
        linear-gradient(180deg,#070a12,#05060a);
    }
    .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.35);backdrop-filter:blur(14px);position:sticky;top:0; z-index: 50;}
    .logo{font-weight:950;letter-spacing:1px;color:var(--accent);text-transform:uppercase}
    .btn{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:white;font-weight:900;cursor:pointer; white-space: nowrap; transition: all 0.2s;}
    .btn:hover{background:rgba(255,255,255,.12); transform: translateY(-1px);}
    .btn-accent{border:0;background:linear-gradient(135deg, rgba(0,212,255,.95), rgba(123,97,255,.85));color:#00131c}
    .btn-accent:hover{opacity: 0.9;}
    .wrap{max-width:1200px;margin:22px auto;padding:0 20px 40px;}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    @media (max-width: 900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width: 520px){.grid{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
    .k{color:var(--muted);font-size:12px}
    .v{font-size:20px;font-weight:950;margin-top:6px}
    h2{margin:22px 0 10px}
    
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border:1px solid var(--border);
      border-radius:16px;
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }
    table{width:100%;border-collapse:collapse; min-width: 700px;} 
    th,td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px; white-space: nowrap;}
    th{color:rgba(255,255,255,.78);text-transform:uppercase;letter-spacing:.5px;font-size:11px}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.10);font-weight:900;font-size:11px}
    .tag.ok{color:var(--ok)} .tag.bad{color:var(--danger)} .tag.mid{color:var(--warn)}
    
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button { margin: 0; padding: 8px 12px; font-size: 12px; }
    
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
    input{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:#e9f2f7;outline:none; width: 100%; max-width: 300px;}
    .msg{margin-top:10px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">Senzu Admin</div> 
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="location.href='/'">Panel</button>
      <button class="btn" onclick="location.href='/logout'">Logout</button>
    </div>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="card"><div class="k">Servers Total</div><div class="v" id="st_total">0</div></div>
      <div class="card"><div class="k">Running</div><div class="v" id="st_run">0</div></div>
      <div class="card"><div class="k">Installing/Starting</div><div class="v" id="st_ins">0</div></div>
      <div class="card"><div class="k">Banned Servers</div><div class="v" id="st_ban">0</div></div>
    </div>

    <div class="grid" style="margin-top:12px">
      <div class="card"><div class="k">Users Total</div><div class="v" id="u_total">0</div></div>
      <div class="card"><div class="k">Active Users</div><div class="v" id="u_active">0</div></div>
      <div class="card"><div class="k">Premium Users</div><div class="v" id="u_premium">0</div></div>
      <div class="card"><div class="k">Rules</div><div class="v" style="font-size:13px">Normal=1 server<br>Premium=16 servers</div></div>
    </div>

    <div class="row" style="margin-top: 20px;">
      <button class="btn btn-accent" onclick="refreshAll()">Refresh Stats</button>
      <span class="msg" id="msg"></span>
    </div>

    <h2>Servers Management</h2>
    <div class="table-responsive">
      <table>
        <thead><tr><th>Folder</th><th>Name</th><th>Owner</th><th>Main File</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="serversT"></tbody>
      </table>
    </div>

    <h2 style="margin-top:30px">Users Management</h2>
    <div class="row"><input id="searchUser" placeholder="Search username..." autocomplete="off" oninput="filterUsers()"></div>
    <div class="table-responsive">
      <table>
        <thead><tr><th>Username</th><th>Email</th><th>Servers</th><th>Account</th><th>Rank</th><th>Actions</th></tr></thead>
        <tbody id="usersT"></tbody>
      </table>
    </div>
  </div>

<script>
let usersCache = [];

function tagStatus(s){
  const st=(s||'').toLowerCase();
  if(st==='running') return '<span class="tag ok">RUNNING</span>';
  if(st==='installing'||st==='starting') return '<span class="tag mid">INSTALLING</span>';
  if(st==='banned') return '<span class="tag bad">BANNED</span>';
  return '<span class="tag">OFFLINE</span>';
}

function escapeHtml(s){ return (s||'').toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;"); }

async function refreshStats(){
  const r=await fetch('/api/admin/quickstats');
  const d=await r.json();
  const s=d.stats||{};
  document.getElementById('st_total').textContent=s.servers_total||0;
  document.getElementById('st_run').textContent=s.servers_running||0;
  document.getElementById('st_ins').textContent=s.servers_installing||0;
  document.getElementById('st_ban').textContent=s.servers_banned||0;
  document.getElementById('u_total').textContent=s.users_total||0;
  document.getElementById('u_active').textContent=s.users_active||0;
  document.getElementById('u_premium').textContent=s.users_premium||0;
}

async function refreshServers(){
  const r=await fetch('/api/admin/servers');
  const d=await r.json();
  const t=document.getElementById('serversT'); t.innerHTML='';
  
  (d.servers||[]).forEach(s=>{
    const isBanned = (s.status === 'Banned');
    const safeTitle = escapeHtml(s.title || 'Unknown');
    const safeKey = escapeHtml(s.key);
    
    t.innerHTML += `
      <tr>
        <td>${escapeHtml(s.folder)}</td>
        <td style="font-weight: 600;">${safeTitle}</td> 
        <td>${escapeHtml(s.owner)}</td>
        <td style="color: var(--accent);">${escapeHtml(s.startup_file) || 'Not set'}</td>
        <td>${tagStatus(s.status)}</td>
        <td class="actions">
          ${isBanned
            ? `<button class="btn" style="border-color:var(--ok); color:var(--ok)" onclick="banServer('${safeKey}', false)">Unban</button>`
            : `<button class="btn" style="border-color:rgba(255,107,107,.35); color:var(--danger)" onclick="banServer('${safeKey}', true)">Ban</button>`}
          
          <button class="btn" style="background: rgba(255,107,107,0.1); border-color:var(--danger); color:var(--danger)" onclick="deleteServer('${safeKey}', '${safeTitle}')">Delete</button>
        </td>
      </tr>`;
  });
}

async function banServer(key, banned){
  await fetch('/api/admin/server/ban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,banned})});
  refreshAll();
}

async function deleteServer(key, title){
  if(!confirm(`CẢNH BÁO: Xác nhận xóa vĩnh viễn server "${title}"?\n\nMọi dữ liệu, file code và log trong thư mục sẽ bị xóa sạch và không thể khôi phục!`)) return;
  
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = "Deleting...";
  btn.disabled = true;

  try {
    const res = await fetch('/api/admin/server/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ key })
    });
    const data = await res.json();
    if(!data.success) {
      alert("Lỗi khi xóa server: " + (data.message || "Unknown error"));
    }
  } catch (err) {
    alert("Lỗi kết nối tới máy chủ.");
  }
  
  refreshAll();
}

async function refreshUsers(){
  const r=await fetch('/api/admin/users');
  const d=await r.json();
  usersCache=d.users||[];
  renderUsers(usersCache);
}

function renderUsers(arr){
  const t=document.getElementById('usersT'); t.innerHTML='';
  arr.forEach(u=>{
    t.innerHTML += `
      <tr>
        <td style="font-weight: 600;">${escapeHtml(u.username)}</td>
        <td>${escapeHtml(u.email) || '-'}</td>
        <td>${u.servers}</td>
        <td>${u.active ? '<span class="tag ok">ACTIVE</span>' : '<span class="tag bad">BANNED</span>'}</td>
        <td>${u.premium ? '<span class="tag ok" style="color: #ffd166; border-color: rgba(255, 209, 102, 0.3);">PREMIUM</span>' : '<span class="tag">NORMAL</span>'}</td>
        <td class="actions">
          <button class="btn" style="${u.active ? 'border-color:rgba(255,107,107,.35); color:var(--danger)' : 'border-color:var(--ok); color:var(--ok)'}" onclick="setActive('${escapeHtml(u.username)}', ${!u.active})">${u.active ? 'Ban' : 'Unban'}</button>
          <button class="btn" style="color: ${u.premium ? 'var(--muted)' : 'var(--accent)'}" onclick="setPremium('${escapeHtml(u.username)}', ${!u.premium})">${u.premium ? 'Remove Premium' : 'Set Premium'}</button>
        </td>
      </tr>`;
  });
}

async function setActive(username, active){
  await fetch('/api/admin/user/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,active})});
  refreshUsers(); refreshStats();
}
async function setPremium(username, premium){
  await fetch('/api/admin/user/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,premium})});
  refreshUsers(); refreshStats();
}
function filterUsers(){
  const q=(document.getElementById('searchUser').value||'').toLowerCase().trim();
  if(!q) return renderUsers(usersCache);
  renderUsers(usersCache.filter(u => (u.username||'').toLowerCase().includes(q)));
}

async function refreshAll(){
  const msg = document.getElementById('msg');
  msg.textContent='Syncing...';
  await Promise.all([refreshStats(), refreshServers(), refreshUsers()]);
  msg.textContent='Data is up to date ✅';
  setTimeout(() => msg.textContent='', 3000);
}

document.addEventListener('DOMContentLoaded', refreshAll);
</script>
</body>
</html>
